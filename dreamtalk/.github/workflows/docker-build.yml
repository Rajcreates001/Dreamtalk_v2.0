# ═══════════════════════════════════════════════════════════════════════
# DreamTalk CI/CD — Docker Build with Layer Caching
#
# This workflow:
#   ✅ Builds the Docker image with BuildKit + GitHub cache
#   ✅ Caches pip packages between builds (~2× faster)
#   ✅ Caches Docker layers between builds (~5× faster)
#   ✅ Runs health checks on the built image
#   ✅ Pushes to Docker Hub / GHCR on main branch
# ═══════════════════════════════════════════════════════════════════════

name: Docker Build & Cache

on:
  push:
    branches: [main, master, develop]
    paths-ignore:
      - "*.md"
      - ".github/**"
      - "docs/**"
  pull_request:
    branches: [main, master]
  workflow_dispatch:  # allow manual trigger

env:
  DOCKER_IMAGE_NAME: dreamtalk-backend
  DOCKER_REGISTRY: ghcr.io
  BUILDKIT_PROGRESS: plain

jobs:
  # ─── Job 1: Build & Cache ──────────────────────────────────────────
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest

    # Permissions needed for GHCR push + cache
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container
          buildkitd-flags: --debug

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ── Extract metadata for tags ──────────────────────────────────
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.DOCKER_REGISTRY }}/${{ github.repository_owner }}/${{ env.DOCKER_IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix=,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' }}

      # ── Build with layer caching ───────────────────────────────────
      - name: Build and cache with BuildKit
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: |
            type=gha,scope=dreamtalk-backend
            type=registry,ref=ghcr.io/${{ github.repository_owner }}/dreamtalk-backend:cache
          cache-to: |
            type=gha,scope=dreamtalk-backend,mode=max
            type=registry,ref=ghcr.io/${{ github.repository_owner }}/dreamtalk-backend:cache,mode=max
          build-args: |
            CUDA_VERSION=12.4.0
            TORCH_VERSION=2.5.1
            MAX_JOBS=4
          outputs: |
            type=image,push-by-digest=false

      # ── Health check (optional, requires Docker to run the image) ──
      - name: Run health check
        if: github.event_name != 'pull_request'
        run: |
          docker run --rm -d --name dreamtalk-test \
            -e DREAMTALK_DEVICE=cpu \
            -p 5000:5000 \
            ghcr.io/${{ github.repository_owner }}/dreamtalk-backend:latest

          echo "Waiting for container to start..."
          sleep 15

          # Health endpoint check
          for i in $(seq 1 10); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:5000/health 2>/dev/null || echo "000")
            if [ "$STATUS" = "200" ]; then
              echo "✅ Health check passed (HTTP $STATUS)"
              break
            fi
            echo "Attempt $i: HTTP $STATUS — waiting..."
            sleep 5
          done

          # Cleanup
          docker stop dreamtalk-test 2>/dev/null || true

  # ─── Job 2: Trivy vulnerability scan ───────────────────────────────
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name != 'pull_request'

    steps:
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/dreamtalk-backend:latest
          format: table
          exit-code: 0  # don't fail on vulnerabilities, just report
          severity: HIGH,CRITICAL
