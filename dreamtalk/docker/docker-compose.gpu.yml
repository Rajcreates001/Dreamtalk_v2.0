# ──────────────────────────────────────────────────────────────────────
# Dreamtalk GPU-Optimized Docker Compose
# Target: ~8-10 GB total disk (image + volumes)
#
# Changes from full docker-compose.yml:
#   ❌ Removed Weaviate           — saves ~950 MB image + data volume
#   ❌ Removed celery-worker       — saves ~8.5 GB duplicate image build
#   ✅ Kept PostgreSQL + Redis     — required by backend
#   ✅ Kept Backend + Frontend     — core services
#   ✅ GPU passthrough (NVIDIA)    — training + inference on GPU
#   ✅ Weights mounted as volume   — no copy into image
# ──────────────────────────────────────────────────────────────────────

x-shared-env: &shared-env
  PYTHONPATH: /app
  TF_ENABLE_ONEDNN_OPTS: "0"
  KMP_DUPLICATE_LIB_OK: "TRUE"
  DB_HOST: postgres
  DB_PORT: "5432"
  DB_USER: postgres
  DB_PASSWORD: ${DB_PASSWORD:-change_me}
  DB_NAME: dream_talk_db
  REDIS_URL: redis://redis:6379/1
  CELERY_BROKER_URL: redis://redis:6379/0
  CELERY_RESULT_BACKEND: redis://redis:6379/0
  TTS_OUTPUT_DIR: /app/pipeline_outputs/tts

services:

  # ── PostgreSQL ────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: dreamtalk-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-change_me}
      POSTGRES_DB: dream_talk_db
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d dream_talk_db"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ── Redis ─────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: dreamtalk-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Backend (FastAPI + GPU) ───────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: dreamtalk-backend:gpu
    container_name: dreamtalk-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    environment:
      <<: *shared-env
    volumes:
      - pipeline-data:/app/pipeline_outputs
      - avatar-static:/app/dreamtalk/avatar/static
      - ./weights:/app/weights          # Mount weights — NOT copied into image
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command:
      - uvicorn
      - dreamtalk.backend.main:app
      - --host
      - 0.0.0.0
      - --port
      - "5000"
      - --workers
      - "1"
      - --log-level
      - info

  # ── Frontend (Next.js) ─────────────────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    image: dreamtalk-frontend:gpu
    container_name: dreamtalk-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: http://backend:5000
      NEXT_PUBLIC_WS_URL: ws://backend:5000/ws
    depends_on:
      - backend

volumes:
  postgres-data:
  redis-data:
  pipeline-data:
  avatar-static:
