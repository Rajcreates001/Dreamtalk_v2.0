# ──────────────────────────────────────────────────────────────────────
# Dreamtalk Podman Compose — Local Dev Stack (All except Backend)
#
# Runs infrastructure (PostgreSQL, Redis, Weaviate) + Frontend (Next.js).
# The backend runs directly in Python (python run_server.py).
#
# Storage:
#   - PostgreSQL: Named volume on WSL ext4 (WSL VHDX is on D: drive)
#   - Redis, Weaviate: D: drive bind mounts at D:\podman-data\
#   - Frontend: No persistent storage (stateless)
#
# Why named volume for PostgreSQL?
#   Windows D: drive (NTFS) mounted via 9p in WSL doesn't support
#   Linux permissions (chown/chmod). PostgreSQL's initdb requires
#   this. Named volumes store on the Linux ext4 filesystem inside
#   WSL, which fully supports Linux permissions.
#
# Network:
#   Frontend uses host networking so it can reach the backend at
#   http://localhost:5000 (backend runs directly on host).
#
# Prerequisites:
#   Run docker/setup_drive.ps1 first (creates D:\podman-data\ dirs)
#
# Usage:
#   sudo podman-compose -f docker/podman-compose.infra.yml up -d
#   sudo podman-compose -f docker/podman-compose.infra.yml down
#   sudo podman-compose -f docker/podman-compose.infra.yml logs -f
# ──────────────────────────────────────────────────────────────────────

version: "3.8"

services:

  # ── PostgreSQL ──────────────────────────────────────────────────────
  postgres:
    image: docker.io/postgres:16-alpine
    container_name: dreamtalk-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-change_me}
      POSTGRES_DB: dream_talk_db
    volumes:
      # Named volume on Linux ext4 (WSL VHDX is on D: drive)
      - dreamtalk-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d dream_talk_db"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ── Redis ───────────────────────────────────────────────────────────
  redis:
    image: docker.io/redis:7-alpine
    container_name: dreamtalk-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - /mnt/d/podman-data/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Weaviate ────────────────────────────────────────────────────────
  weaviate:
    image: docker.io/semitechnologies/weaviate:latest
    container_name: dreamtalk-weaviate
    restart: unless-stopped
    ports:
      - "8080:8080"
      - "50051:50051"
    environment:
      CLUSTER_HOSTNAME: "node1"
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: "true"
      PERSISTENCE_DATA_PATH: "/var/lib/weaviate"
      DEFAULT_VECTORIZER_MODULE: "none"
      ENABLE_MODULES: ""
    volumes:
      - /mnt/d/podman-data/weaviate:/var/lib/weaviate
    healthcheck:
      test: ["CMD", "wget", "--spider", "http://localhost:8080/v1/.well-known/ready"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Frontend (Next.js Dev Server) ──────────────────────────────────
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: dreamtalk-frontend
    restart: unless-stopped
    network_mode: host
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_API_URL: http://localhost:5000
      NEXT_PUBLIC_WS_URL: ws://localhost:5000/ws
      NEXT_PUBLIC_VRM_MODEL_URL: /models/utsuwa.vrm
      NEXT_TELEMETRY_DISABLED: "1"
    healthcheck:
      test: ["CMD", "wget", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3

volumes:
  dreamtalk-pgdata:
    # Named volume stored on WSL Linux ext4 filesystem
    # WSL VHDX is configured on D: drive (see: wsl --manage)
