# ──────────────────────────────────────────────────────────────────────
# DreamTalk Docker Compose — Production Configuration
# ──────────────────────────────────────────────────────────────────────
# Architecture:
#   postgres    (PostgreSQL 16)  → persistent volume
#   redis       (Redis 7)        → persistent volume
#   weaviate    (Vector DB)      → persistent volume
#   backend     (FastAPI + GPU)  → depends on postgres, redis, weaviate
#   frontend    (Next.js 16)     → depends on backend
#   indicf5     (TTS microservice)→ IndicF5 voice cloning (CPU)
#
# Port Mapping (avoids LifeLink conflicts on 5432/6379/8080/3001/5000):
#   DreamTalk Backend:  5050 → 5000 (internal; Windows reserves 4935-5034)
#   DreamTalk Frontend: 3000 → 3000 (internal)
#   DreamTalk Postgres: 5433 → 5432 (internal)
#   DreamTalk Redis:    6380 → 6379 (internal)
#   DreamTalk Weaviate: 8081 → 8080 (internal)
#   DreamTalk Weaviate gRPC: 50052 → 50051 (internal)
#
# Usage:
#   docker compose -f docker-compose.dreamtalk.yml --env-file .env.docker up -d
#   docker compose -f docker-compose.dreamtalk.yml --env-file .env.docker down
#   docker compose -f docker-compose.dreamtalk.yml --env-file .env.docker logs -f
# ──────────────────────────────────────────────────────────────────────

x-shared-env: &shared-env
  PYTHONPATH: /app
  TF_ENABLE_ONEDNN_OPTS: "0"
  KMP_DUPLICATE_LIB_OK: "TRUE"
  DB_HOST: postgres
  DB_PORT: "5432"
  DB_USER: postgres
  DB_PASSWORD: ${DB_PASSWORD:-change_me}
  DB_NAME: dream_talk_db
  REDIS_URL: redis://redis:6379/1
  CELERY_BROKER_URL: redis://redis:6379/0
  CELERY_RESULT_BACKEND: redis://redis:6379/0
  WEAVIATE_URL: http://weaviate:8080
  WEAVIATE_HOST: weaviate
  WEAVIATE_PORT: "8080"
  WEAVIATE_GRPC_PORT: "50051"
  GPU_SERVER_BASE_URL: ${GPU_SERVER_BASE_URL:-http://144.79.62.242:8002/v1}
  LLM_MODEL_NAME: ${LLM_MODEL_NAME:-gpt-oss-120b-coding}
  LLM_MAX_TOKENS: ${LLM_MAX_TOKENS:-512}
  LLM_TIMEOUT: ${LLM_TIMEOUT:-60.0}
  LLM_BACKEND: ${LLM_BACKEND:-openai}
  # Ollama removed as the fallback.
  #
  # It ran llama3.1:8b on the HOST GPU and held ~5.3 GB of the 8 GB card
  # whenever a reply was generated — which is immediately before every 2D
  # render. That is what starved MuseTalk and forced the VRAM eviction dance.
  # gpt-oss-120b already runs remotely on GPU_SERVER_BASE_URL, so nothing
  # needs a local LLM at all; the fallback now points at the same vLLM.
  # Set LLM_FALLBACK_BASE_URL back to host.docker.internal:11434 only if you
  # deliberately want a local Ollama again.
  LLM_FALLBACK_BASE_URL: ${LLM_FALLBACK_BASE_URL:-http://144.79.62.242:8002/v1}
  LLM_FALLBACK_MODEL: ${LLM_FALLBACK_MODEL:-gpt-oss-120b-coding}
  INDICF5_BASE_URL: ${INDICF5_BASE_URL:-http://indicf5:8002}
  INDICF5_MICROSERVICE_URL: ${INDICF5_MICROSERVICE_URL:-http://indicf5:8002}
  INDICF5_TIMEOUT: ${INDICF5_TIMEOUT:-900}
  INDICF5_NFE_STEPS: ${INDICF5_NFE_STEPS:-8}
  INDICMIO_BASE_URL: ${INDICMIO_BASE_URL:-http://indic-mio:8001}
  WHISPER_MODEL_SIZE: ${WHISPER_MODEL_SIZE:-small}
  WHISPER_DEVICE: ${WHISPER_DEVICE:-auto}
  AVATAR_LLM_MAX_TOKENS: ${AVATAR_LLM_MAX_TOKENS:-120}
  AVATAR_2D_FPS: ${AVATAR_2D_FPS:-25}
  AVATAR_2D_MAX_SIDE: ${AVATAR_2D_MAX_SIDE:-768}
  MUSETALK_BATCH_SIZE: ${MUSETALK_BATCH_SIZE:-4}
  MUSETALK_ALLOW_CPU: ${MUSETALK_ALLOW_CPU:-false}
  # Half precision. MuseTalk loaded in fp32 by default, which does not fit an
  # 8 GB card: every render died with "CUDA driver error: out of memory" in the
  # VAE encode and silently fell back to the audio-reactive renderer, so the 2D
  # avatar never actually moved its mouth.
  MUSETALK_FP16: ${MUSETALK_FP16:-1}
  # With fp16 the stack needs roughly half what it did, so the pre-load
  # headroom bar comes down accordingly. It was 6.5 GB, sized for fp32 — on a
  # card also hosting the LLM that bar could never be met.
  MUSETALK_MIN_FREE_VRAM_GB: ${MUSETALK_MIN_FREE_VRAM_GB:-4.0}
  MUSETALK_MOUTH_MASK_GAIN: ${MUSETALK_MOUTH_MASK_GAIN:-1.0}
  AVATAR_REQUIRE_GPU: ${AVATAR_REQUIRE_GPU:-true}
  # Keep MuseTalk resident between renders.
  #
  # This defaulted to true, so the model was discarded after EVERY render and
  # the next one paid the full cold load again. That load is ~20 minutes here
  # (3.2 GB checkpoint, ~183s of CPU-bound unpickling for 686 tensors, plus
  # fp16 conversion), which is why a 3-second clip measured 3482s end to end
  # and why avatar_2d status kept reporting neural_loaded false moments after
  # a successful warm-up. It also made the startup warm-up pointless: the
  # first render consumed it and every render after paid full price.
  #
  # The card has room. Measured with vLLM serving Indic-Mio: 7096 MiB free of
  # 8188, against ~2 GB for MuseTalk. Set this true again on a card where
  # something else genuinely needs the memory back between renders.
  AVATAR_GPU_UNLOAD_AFTER_RENDER: ${AVATAR_GPU_UNLOAD_AFTER_RENDER:-false}
  CUDA_VISIBLE_DEVICES: ${CUDA_VISIBLE_DEVICES:-0}
  NVIDIA_VISIBLE_DEVICES: ${NVIDIA_VISIBLE_DEVICES:-all}
  # expandable_segments is deliberately OFF.
  #
  # It backs the caching allocator with CUDA's virtual-memory API
  # (cuMemCreate/cuMemMap) instead of plain cudaMalloc. WSL2's GPU
  # paravirtualisation implements that API incompletely, and under memory
  # pressure MuseTalk's load died with
  #   RuntimeError: !handles_.at(i) INTERNAL ASSERT FAILED at
  #   "../c10/cuda/CUDACachingAllocator.cpp":393
  # which is the expandable-segments unmap path failing. Worse than the
  # error: it left the allocator wedged, and every thread in the process
  # ended up in futex_wait_queue with no GPU work, no disk I/O and a request
  # that never returned — a hard deadlock, not a clean OOM.
  #
  # max_split_size_mb is kept: it limits fragmentation and uses the ordinary
  # cudaMalloc path, which WSL2 handles correctly.
  PYTORCH_CUDA_ALLOC_CONF: ${PYTORCH_CUDA_ALLOC_CONF:-max_split_size_mb:128}
  AVATAR_RUNTIME_DIR: /app/dreamtalk/media/avatar_runtime
  BACKEND_PUBLIC_PORT: "5050"
  JWT_SECRET: ${JWT_SECRET:-dreamtalk-dev-jwt-secret-2026-change-in-production}
  TTS_OUTPUT_DIR: /app/dreamtalk/pipeline_outputs/tts

services:

  # ── PostgreSQL ──────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: dreamtalk-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-change_me}
      POSTGRES_DB: dream_talk_db
    ports:
      - "5433:5432"
    volumes:
      - dreamtalk-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d dream_talk_db"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - dreamtalk

  # ── Redis ───────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: dreamtalk-redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - dreamtalk-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dreamtalk

  # ── Weaviate (Vector DB) ───────────────────────────────────────────
  weaviate:
    image: semitechnologies/weaviate:latest
    container_name: dreamtalk-weaviate
    restart: unless-stopped
    ports:
      - "8081:8080"
      - "50052:50051"
    environment:
      CLUSTER_HOSTNAME: "node1"
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: "true"
      PERSISTENCE_DATA_PATH: "/var/lib/weaviate"
      DEFAULT_VECTORIZER_MODULE: "none"
      ENABLE_MODULES: ""
    volumes:
      - dreamtalk-weaviate:/var/lib/weaviate
    healthcheck:
      test: ["CMD", "wget", "--spider", "http://localhost:8080/v1/.well-known/ready"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dreamtalk

  # ── Backend (FastAPI + GPU) ─────────────────────────────────────────
  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: dreamtalk-backend:latest
    container_name: dreamtalk-backend
    restart: unless-stopped
    gpus: all
    ports:
      - "5050:5000"
    environment:
      <<: *shared-env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ../:/app/dreamtalk/
      - ../weights:/app/weights:ro
      - dreamtalk-deepface:/root/.deepface
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      weaviate:
        condition: service_healthy
      indicf5:
        condition: service_healthy
    command:
      - uvicorn
      - dreamtalk.backend.main:app
      - --host
      - 0.0.0.0
      - --port
      - "5000"
      - --workers
      - "1"
      - --log-level
      - info
      - --timeout-graceful-shutdown
      - "600"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:5000/livez"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
    networks:
      - dreamtalk

  # ── Frontend (Next.js 16) ──────────────────────────────────────────
  frontend:
    build:
      context: ../frontend
      dockerfile: ../docker/Dockerfile.frontend
      args:
        # NEXT_PUBLIC_* are baked in at build time — must be passed here.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:5050}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost:5050/api/v1/avatar/ws/realtime}
    image: dreamtalk-frontend:latest
    container_name: dreamtalk-frontend
    restart: unless-stopped
    ports:
      - "4000:3000"
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:5050}
      NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost:5050/api/v1/avatar/ws/realtime}
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 10s
      start_period: 25s
      retries: 3
    networks:
      - dreamtalk

  # ── IndicF5 Voice Cloning Microservice ──────────────────────────────
  indicf5:
    build:
      context: ..
      dockerfile: docker/Dockerfile.indicf5
    image: dreamtalk-indicf5:latest
    container_name: dreamtalk-indicf5
    restart: unless-stopped
    # NOTE: this runs on CPU, and it is the dominant cost in a text reply
    # (16-23s measured). The microservice already selects CUDA when it can see
    # a device, so it is NOT enough to add `gpus:` here — Dockerfile.indicf5
    # builds on python:3.11-slim and installs torch from the /whl/cpu index,
    # so the image ships torch 2.5.1+cpu and cannot use a GPU at all.
    # Moving it needs: a CUDA runtime base + cu124 torch wheels + `gpus: all`,
    # and ~2GB VRAM that must be budgeted against MuseTalk's ~6.5GB on an 8GB
    # card. See docs/COMPETITIVE_GAP_ANALYSIS.md §3.1.
    ports:
      - "8002:8002"
    environment:
      INDICF5_WEIGHTS_DIR: /app/weights/voice/indic_tts/IndicF5
      INDICF5_PORT: "8002"
      INDICF5_NFE_STEPS: ${INDICF5_NFE_STEPS:-8}
    volumes:
      - ../:/app/dreamtalk/:ro
      - ../weights:/app/weights:ro
    command:
      - python
      - -m
      - uvicorn
      - dreamtalk.voice.core.vc.indicf5_microservice:app
      - --host
      - 0.0.0.0
      - --port
      - "8002"
      - --log-level
      - info
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8002/health"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
    networks:
      - dreamtalk

  # ── Indic-Mio: all 22 scheduled Indian languages + English ────────
  # The 0.6B speech-token model and MioCodec are isolated so the API can
  # schedule GPU-heavy avatar rendering without importing them in-process.
  indic-mio-llm:
    image: vllm/vllm-openai:v0.29.0-cu129
    container_name: dreamtalk-indic-mio-llm
    restart: unless-stopped
    gpus: all
    environment:
      HUGGING_FACE_HUB_TOKEN: ${HUGGING_FACE_HUB_TOKEN:-}
      HF_HOME: /models/huggingface
      NVIDIA_VISIBLE_DEVICES: ${NVIDIA_VISIBLE_DEVICES:-all}
      # Without this vLLM refuses to start here at all:
      #   RuntimeError: UVA is not available   (v1/worker/gpu/buffer_utils.py)
      # vLLM gates UVA on pinned memory, and under WSL it disables pinned
      # memory BY DEFAULT even on kernels that support it — this box runs
      # 6.6.87, far above vLLM's own 4.19.121 threshold, and
      # torch.zeros(1024, pin_memory=True) succeeds. The opt-in flag is the
      # supported way to say so.
      VLLM_WSL2_ENABLE_PIN_MEMORY: "1"
    volumes:
      - dreamtalk-huggingface:/models/huggingface
    command:
      - --model
      - SPRINGLab/Indic-Mio
      - --max-model-len
      - "1536"
      # 0.35 of an 8 GiB card is 2865 MiB, and after 1157 MiB of weights,
      # activations and captured CUDA graphs there was nothing left:
      #   Available KV cache memory: -1.13 GiB
      #   ValueError: No available memory for the cache blocks
      # 0.45 leaves roughly 2.5 GiB for activations and KV, which is ample
      # for a 0.6B model capped at 1536 tokens, while still fitting beside
      # MuseTalk (~2 GiB, and it unloads after each render).
      - --gpu-memory-utilization
      - ${INDICMIO_GPU_MEMORY_UTILIZATION:-0.45}
      # CUDA graphs stay ON. --enforce-eager was set here to save memory, and
      # it cost far more than it saved: without graphs every decoded token
      # goes through Python dispatch, so vLLM's throughput becomes a function
      # of spare CPU. Measured on this box while MuseTalk was loading in
      # another container (backend at 126% CPU, GPU at 0%):
      #
      #   Avg generation throughput: 1.4 - 5.0 tokens/s
      #
      # for a 0.6B model that should run 50-200 tok/s. Speech-token sequences
      # are hundreds of tokens, so Indic-Mio's internal call hit httpx.ReadTimeout
      # and returned 502 to the backend - while /health stayed green, which is
      # why the service looked fine. Graph replay removes that per-token
      # Python cost and makes synthesis robust to a busy CPU.
      #
      # Memory is not the constraint it was: the OOM that prompted --enforce-eager
      # happened at 0.35 utilization, and 0.45 measured 2.27 GiB of KV cache
      # headroom with eager mode, which comfortably absorbs the graphs.
      # Bound concurrent sequences so activation memory cannot spike into
      # MuseTalk's headroom. Speech synthesis here is one request at a time.
      - --max-num-seqs
      - "8"
      - --dtype
      - bfloat16
      - --trust-remote-code
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      start_period: 300s
      retries: 10
    networks:
      - dreamtalk

  indic-mio:
    build:
      context: ..
      dockerfile: docker/Dockerfile.indicmio
    image: dreamtalk-indic-mio:latest
    container_name: dreamtalk-indic-mio
    restart: unless-stopped
    gpus: all
    ports:
      - "8001:8001"
    environment:
      MIOTTS_LLM_BASE_URL: http://indic-mio-llm:8000/v1
      MIOTTS_LLM_MODEL: SPRINGLab/Indic-Mio
      MIOTTS_CODEC_MODEL: Aratako/MioCodec-25Hz-44.1kHz-v2
      MIOTTS_DEVICE: cuda
      MIOTTS_BEST_OF_N_ENABLED: ${MIOTTS_BEST_OF_N_ENABLED:-false}
      MIOTTS_BEST_OF_N_DEFAULT: ${MIOTTS_BEST_OF_N_DEFAULT:-1}
      # The sampler defaults to temperature 0.8 with top_p 1.0, and nothing
      # trims the tail. Synthesising the same Kashmiri sentence three times
      # from one profile produced speaker similarities of 0.6731, 0.8736 and
      # 0.8080 - a spread of 0.20, wider than the gap between two different
      # avatars, and the low take sits below the 0.7447 an unrelated speaker
      # scores. Overridable so the effect can be measured rather than assumed.
      MIOTTS_LLM_TEMPERATURE: ${MIOTTS_LLM_TEMPERATURE:-0.8}
      MIOTTS_LLM_TOP_P: ${MIOTTS_LLM_TOP_P:-0.9}
      MIOTTS_MAX_TEXT_LENGTH: "600"
      HF_HOME: /models/huggingface
      NVIDIA_VISIBLE_DEVICES: ${NVIDIA_VISIBLE_DEVICES:-all}
    volumes:
      - dreamtalk-huggingface:/models/huggingface
    # Its own /health answers 200 as soon as the HTTP server is up, which is
    # long before it can synthesize anything: the vLLM backend behind it takes
    # minutes to load. depends_on covers an orderly `up`, but a restart policy
    # does not honour depends_on, so after the host crash this container came
    # back first, reported healthy, and every clone request fell through to the
    # edge-tts stand-in with "All connection attempts failed" buried in a
    # fallback_reason. Health has to mean the capability, not the process.
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:8001/health && curl --fail --silent http://indic-mio-llm:8000/health"]
      interval: 30s
      timeout: 10s
      start_period: 600s
      retries: 5
    depends_on:
      indic-mio-llm:
        condition: service_healthy
    networks:
      - dreamtalk

  # ── mesh3d: TripoSR, single image -> real geometry ────────────────
  # Separate service because it wants ~6GB VRAM on a card already holding
  # vLLM and MuseTalk. It loads lazily and exposes /unload, so avatar
  # creation can take the card, build the mesh, and hand it back.
  mesh3d:
    build:
      context: ..
      dockerfile: docker/Dockerfile.mesh3d
    image: dreamtalk-mesh3d:latest
    container_name: dreamtalk-mesh3d
    restart: unless-stopped
    gpus: all
    ports:
      - "8003:8003"
    environment:
      MESH3D_PORT: "8003"
      MESH3D_CHUNK_SIZE: ${MESH3D_CHUNK_SIZE:-4096}
      MESH3D_MC_RESOLUTION: ${MESH3D_MC_RESOLUTION:-256}
      HF_HOME: /models/huggingface
      # rembg fetches u2net.onnx (~176MB) on first use and defaults to the
      # home directory, which is not on a volume - so every restart would
      # download it again before the first reconstruction could start. Point
      # it at the volume that already holds the TripoSR weights.
      U2NET_HOME: /models/huggingface/u2net
      NVIDIA_VISIBLE_DEVICES: ${NVIDIA_VISIBLE_DEVICES:-all}
    volumes:
      - dreamtalk-huggingface:/models/huggingface
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8003/health"]
      interval: 30s
      timeout: 10s
      start_period: 240s
      retries: 5
    networks:
      - dreamtalk


# ── Named Volumes ─────────────────────────────────────────────────────
# Docker Desktop manages these. If Docker is configured to use D: drive,
# all volume data automatically lives on D:.
# To verify: docker volume inspect dreamtalk-postgres → check Mountpoint
volumes:
  dreamtalk-postgres:
  dreamtalk-redis:
  dreamtalk-weaviate:
  dreamtalk-pipeline:
  dreamtalk-avatar-static:
  dreamtalk-weights:
  dreamtalk-huggingface:
  dreamtalk-deepface:

# ── Network ───────────────────────────────────────────────────────────
# Isolated network — DreamTalk containers only.
# No cross-project contamination with LifeLink.
networks:
  dreamtalk:
    name: dreamtalk-network
    driver: bridge
