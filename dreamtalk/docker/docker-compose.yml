# ──────────────────────────────────────────────────────────────────────
# Dreamtalk Docker Compose
# Architecture:
#   backend   (FastAPI)     → postgres, redis, weaviate
#   celery-worker           → redis (broker), postgres, weaviate
#   redis     (broker/cache)
#   postgres  (main DB)
#   weaviate  (vector DB)
# ──────────────────────────────────────────────────────────────────────

x-shared-env: &shared-env
  PYTHONPATH: /app
  TF_ENABLE_ONEDNN_OPTS: "0"
  KMP_DUPLICATE_LIB_OK: "TRUE"
  DB_HOST: postgres
  DB_PORT: "5432"
  DB_USER: postgres
  DB_PASSWORD: ${DB_PASSWORD:-change_me}
  DB_NAME: dream_talk_db
  REDIS_URL: redis://redis:6379/1
  CELERY_BROKER_URL: redis://redis:6379/0
  CELERY_RESULT_BACKEND: redis://redis:6379/0
  WEAVIATE_URL: http://weaviate:8080
  WEAVIATE_HOST: weaviate
  WEAVIATE_PORT: "8080"
  WEAVIATE_GRPC_PORT: "50051"
  GPU_SERVER_BASE_URL: http://144.79.62.242:8000/v1
  LLM_MODEL_NAME: Qwen3.6-27B
  JWT_SECRET: change-this-to-a-secure-random-secret-in-production
  TTS_OUTPUT_DIR: /app/pipeline_outputs/tts

services:

  # ── PostgreSQL ──────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: dreamtalk-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-change_me}
      POSTGRES_DB: dream_talk_db
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d dream_talk_db"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ── Redis ───────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: dreamtalk-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Weaviate ────────────────────────────────────────────────────────
  weaviate:
    image: semitechnologies/weaviate:latest
    container_name: dreamtalk-weaviate
    restart: unless-stopped
    ports:
      - "8080:8080"
      - "50051:50051"
    environment:
      CLUSTER_HOSTNAME: "node1"
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: "true"
      PERSISTENCE_DATA_PATH: "/var/lib/weaviate"
      DEFAULT_VECTORIZER_MODULE: "none"
      ENABLE_MODULES: ""
    volumes:
      - weaviate-data:/var/lib/weaviate
    healthcheck:
      test: ["CMD", "wget", "--spider", "http://localhost:8080/v1/.well-known/ready"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Backend (FastAPI) ──────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dreamtalk-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    environment:
      <<: *shared-env
    volumes:
      - pipeline-data:/app/pipeline_outputs
      - avatar-static:/app/dreamtalk/avatar/static
      - ./dreamtalk/pipeline/brain_pipeline.py:/app/dreamtalk/pipeline/brain_pipeline.py
      - ./dreamtalk/backend/main.py:/app/dreamtalk/backend/main.py
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      weaviate:
        condition: service_healthy
    command:
      - uvicorn
      - dreamtalk.backend.main:app
      - --host
      - 0.0.0.0
      - --port
      - "5000"
      - --workers
      - "1"
      - --log-level
      - info

  # ── Frontend (Next.js) ─────────────────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: dreamtalk-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: http://backend:5000
      NEXT_PUBLIC_WS_URL: ws://backend:5000/ws
    depends_on:
      - backend

  # ── IndicF5 Voice Cloning Microservice ──────────────────────────────
  indicf5:
    build:
      context: .
      dockerfile: Dockerfile.indicf5
    container_name: dreamtalk-indicf5
    restart: unless-stopped
    ports:
      - "8002:8002"
    environment:
      INDICF5_WEIGHTS_DIR: /app/weights/voice/indic_tts/IndicF5
      INDICF5_PORT: "8002"
    volumes:
      - ./weights:/app/weights
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8002/health"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3

  # ── Celery Worker ────────────────────────────────────────────────────
  celery-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dreamtalk-celery
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    environment:
      <<: *shared-env
    volumes:
      - pipeline-data:/app/pipeline_outputs
      - avatar-static:/app/dreamtalk/avatar/static
      - ./dreamtalk/pipeline/brain_pipeline.py:/app/dreamtalk/pipeline/brain_pipeline.py
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      weaviate:
        condition: service_healthy
    command:
      - celery
      - -A
      - dreamtalk.backend.celery_app
      - worker
      - --loglevel=info
      - --concurrency=2
      - --max-tasks-per-child=10

volumes:
  postgres-data:
  redis-data:
  weaviate-data:
  pipeline-data:
  avatar-static:
