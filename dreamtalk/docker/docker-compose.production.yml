# DreamTalk — Production Docker Compose
# Includes Nginx reverse proxy with TLS termination
# Usage: docker compose -f docker-compose.production.yml --env-file ../.env up -d

x-shared-env: &shared-env
  PYTHONPATH: /app
  TF_ENABLE_ONEDNN_OPTS: "0"
  KMP_DUPLICATE_LIB_OK: "TRUE"
  DB_HOST: postgres
  DB_PORT: "5432"
  DB_USER: postgres
  DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
  DB_NAME: dream_talk_db
  REDIS_URL: redis://redis:6379/1
  CELERY_BROKER_URL: redis://redis:6379/0
  CELERY_RESULT_BACKEND: redis://redis:6379/0
  WEAVIATE_URL: http://weaviate:8080
  WEAVIATE_HOST: weaviate
  WEAVIATE_PORT: "8080"
  GPU_SERVER_BASE_URL: http://host.docker.internal:11434/v1
  LLM_MODEL_NAME: deepseek-r1:7b
  JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
  TTS_OUTPUT_DIR: /app/dreamtalk/pipeline_outputs/tts
  LOG_LEVEL: warning

services:

  # ── Nginx Reverse Proxy ────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: dreamtalk-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # - ./ssl:/etc/nginx/ssl:ro  # Uncomment for TLS
    depends_on:
      - backend
      - frontend
    networks:
      - dreamtalk

  # ── PostgreSQL ─────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: dreamtalk-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: dream_talk_db
    volumes:
      - dreamtalk-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d dream_talk_db"]
      interval: 30s
      timeout: 10s
      retries: 10
    networks:
      - dreamtalk

  # ── Redis ──────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: dreamtalk-redis
    restart: unless-stopped
    volumes:
      - dreamtalk-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - dreamtalk

  # ── Weaviate ───────────────────────────────────────────────
  weaviate:
    image: semitechnologies/weaviate:latest
    container_name: dreamtalk-weaviate
    restart: unless-stopped
    environment:
      CLUSTER_HOSTNAME: "node1"
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: "true"
      PERSISTENCE_DATA_PATH: "/var/lib/weaviate"
      DEFAULT_VECTORIZER_MODULE: "none"
    volumes:
      - dreamtalk-weaviate:/var/lib/weaviate
    healthcheck:
      test: ["CMD", "wget", "--spider", "http://localhost:8080/v1/.well-known/ready"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - dreamtalk

  # ── Backend ────────────────────────────────────────────────
  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: dreamtalk-backend:latest
    container_name: dreamtalk-backend
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    environment:
      <<: *shared-env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ../:/app/dreamtalk/
      - ../weights:/app/weights:ro
      - dreamtalk-pipeline:/app/dreamtalk/pipeline_outputs
      - dreamtalk-avatar-static:/app/dreamtalk/avatar/static
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      weaviate:
        condition: service_healthy
    command:
      - uvicorn
      - dreamtalk.backend.main:app
      - --host
      - 0.0.0.0
      - --port
      - "5000"
      - --workers
      - "2"
      - --log-level
      - warning
    networks:
      - dreamtalk

  # ── Frontend ───────────────────────────────────────────────
  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
    image: dreamtalk-frontend:latest
    container_name: dreamtalk-frontend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: http://localhost
      NEXT_PUBLIC_WS_URL: ws://localhost
    depends_on:
      - backend
    networks:
      - dreamtalk

  # ── IndicF5 ───────────────────────────────────────────────
  indicf5:
    build:
      context: ..
      dockerfile: docker/Dockerfile.indicf5
    image: dreamtalk-indicf5:latest
    container_name: dreamtalk-indicf5
    restart: unless-stopped
    environment:
      INDICF5_WEIGHTS_DIR: /app/weights/voice/indic_tts/IndicF5
      INDICF5_PORT: "8002"
    volumes:
      - ../:/app/dreamtalk/:ro
      - ../weights:/app/weights:ro
    networks:
      - dreamtalk

volumes:
  dreamtalk-postgres:
  dreamtalk-redis:
  dreamtalk-weaviate:
  dreamtalk-pipeline:
  dreamtalk-avatar-static:

networks:
  dreamtalk:
    name: dreamtalk-network
    driver: bridge
